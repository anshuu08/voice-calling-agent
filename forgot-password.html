<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — TakeRemo</title>
  <meta name="description" content="Reset your TakeRemo account password securely.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/auth.css">
</head>

<body class="auth-body">
  <div class="auth-bg-ambient"></div>
  <div class="auth-bg-grid"></div>

  <div class="auth-page-wrapper">
    <!-- Brand Header -->
    <header class="auth-brand-header">
      <a href="/" class="auth-brand-link" title="Return to TakeRemo Home">
        <img src="/assets/Takeremo%20AI%20Calling%20Logo.png" alt="TakeRemo AI Calling" style="height: 36px; width: auto; object-fit: contain;">
      </a>
    </header>

    <!-- Forgot Password Card -->
    <main class="auth-card">
      <div class="auth-header">
        <h1 class="auth-headline">Forgot your password?</h1>
        <p class="auth-subtitle">Enter your registered email address and we'll send you a link to reset your password.
        </p>
      </div>

      <!-- Alert Notification Container -->
      <div id="auth-alert-container" style="display: none;"></div>

      <form class="auth-form" id="forgot-password-form" novalidate>
        <!-- Email -->
        <div class="form-group">
          <label class="form-label" for="forgot-email">Account Email</label>
          <div class="input-wrapper">
            <input type="email" id="forgot-email" class="auth-input" placeholder="name@company.com" required
              autocomplete="email">
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-auth-primary">
          <span>Send Reset Link</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="9 18 15 12 9 6" />
          </svg>
        </button>
      </form>

      <!-- Footer Link -->
      <footer class="auth-footer" style="margin-top: 30px;">
        <span>Remember your password?</span>
        <a href="/signin" class="auth-footer-link">Sign In</a>
      </footer>
    </main>

    <a href="/signin" class="auth-back-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="15 18 9 12 15 6" />
      </svg>
      <span>Back to Sign In</span>
    </a>
  </div>

  <script src="/auth-client.js"></script>
</body>

</html>
