<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — TakeRemo</title>
  <meta name="description" content="Reset your TakeRemo account password securely.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
    <link rel="icon" type="image/jpeg" href="/assets/tab.jpeg">
  <link rel="apple-touch-icon" href="/assets/tab.jpeg">
  <link rel="stylesheet" href="/auth.css">
</head>

<body class="auth-body">
  <div class="auth-bg-ambient"></div>
  <div class="auth-bg-grid"></div>

  <div class="auth-page-wrapper">
    <!-- Brand Header -->
    <header class="auth-brand-header">
      <a href="/" class="auth-brand-link" title="Return to TakeRemo Home">
        <img src="/assets/Takeremo%20AI%20Calling%20Logo.png" alt="TakeRemo AI Calling" style="height: 36px; width: auto; object-fit: contain;">
      </a>
    </header>

    <!-- Forgot Password Card -->
    <main class="auth-card">
      <div class="auth-header">
        <h1 class="auth-headline">Forgot your password?</h1>
        <p class="auth-subtitle" id="forgot-subtitle">Enter your registered email address and we'll send you a 6-digit
          code to reset your password.
        </p>
      </div>

      <!-- Alert Notification Container -->
      <div id="auth-alert-container" style="display: none;"></div>

      <form class="auth-form" id="forgot-password-form" novalidate>
        <!-- Email -->
        <div class="form-group">
          <label class="form-label" for="forgot-email">Account Email</label>
          <div class="input-wrapper">
            <input type="email" id="forgot-email" class="auth-input" placeholder="name@company.com" required
              autocomplete="email">
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-auth-primary">
          <span>Send Code</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="9 18 15 12 9 6" />
          </svg>
        </button>
      </form>

      <!-- Step 2: code + new password (hidden until a code is requested) -->
      <form class="auth-form" id="reset-otp-form" style="display: none;" novalidate>
        <div class="form-group">
          <label class="form-label" for="reset-otp">6-digit code</label>
          <div class="input-wrapper">
            <input type="text" id="reset-otp" class="auth-input otp-input" inputmode="numeric" pattern="[0-9]*"
              maxlength="6" placeholder="000000" autocomplete="one-time-code" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reset-new-password">New Password</label>
          <div class="input-wrapper">
            <input type="password" id="reset-new-password" class="auth-input input-has-toggle"
              placeholder="At least 6 characters" required autocomplete="new-password">
            <button type="button" class="btn-toggle-pwd" data-target="reset-new-password"
              aria-label="Toggle password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reset-confirm-password">Confirm New Password</label>
          <div class="input-wrapper">
            <input type="password" id="reset-confirm-password" class="auth-input input-has-toggle"
              placeholder="Re-enter new password" required autocomplete="new-password">
            <button type="button" class="btn-toggle-pwd" data-target="reset-confirm-password"
              aria-label="Toggle password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-auth-primary">
          <span>Reset Password</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="9 18 15 12 9 6" />
          </svg>
        </button>
        <div class="otp-actions">
          <button type="button" class="otp-link" id="reset-resend">Resend code</button>
          <button type="button" class="otp-link" id="reset-change">Change email</button>
        </div>
      </form>

      <!-- Footer Link -->
      <footer class="auth-footer" style="margin-top: 30px;">
        <span>Remember your password?</span>
        <a href="/signin" class="auth-footer-link">Sign In</a>
      </footer>
    </main>

    <a href="/signin" class="auth-back-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="15 18 9 12 15 6" />
      </svg>
      <span>Back to Sign In</span>
    </a>
  </div>

  <script src="/auth-client.js"></script>
</body>

</html>
