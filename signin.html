<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — TakeRemo</title>
  <meta name="description"
    content="Log in to your TakeRemo account. Manage your AI employees and voice conversation intelligence.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/auth.css">
</head>

<body class="auth-body">
  <div class="auth-bg-ambient"></div>
  <div class="auth-bg-grid"></div>

  <div class="auth-page-wrapper">
    <!-- Brand Header -->
    <header class="auth-brand-header">
      <a href="/" class="auth-brand-link" title="Return to TakeRemo Home">
        <img src="/assets/Takeremo%20AI%20Calling%20Logo.png" alt="TakeRemo AI Calling" style="height: 36px; width: auto; object-fit: contain;">
      </a>
    </header>

    <!-- Signin Card -->
    <main class="auth-card">
      <div class="auth-header">
        <h1 class="auth-headline">Welcome back</h1>
        <p class="auth-subtitle">Log in to continue to TakeRemo.</p>
      </div>

      <!-- Alert Notification Container -->
      <div id="auth-alert-container" style="display: none;"></div>

      <form class="auth-form" id="signin-form" novalidate>
        <!-- Email -->
        <div class="form-group">
          <label class="form-label" for="signin-email">Email Address</label>
          <div class="input-wrapper">
            <input type="email" id="signin-email" class="auth-input" placeholder="name@company.com" required
              autocomplete="email">
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <div class="form-label-row">
            <label class="form-label" for="signin-password">Password</label>
            <a href="/forgot-password" class="form-link-subtle">Forgot password?</a>
          </div>
          <div class="input-wrapper">
            <input type="password" id="signin-password" class="auth-input input-has-toggle"
              placeholder="Enter your password" required autocomplete="current-password">
            <button type="button" class="btn-toggle-pwd" data-target="signin-password"
              aria-label="Toggle password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-auth-primary">
          <span>Login</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="9 18 15 12 9 6" />
          </svg>
        </button>
      </form>

      <!-- OR Divider -->
      <div class="auth-divider">
        <span>OR</span>
      </div>

      <!-- Google Sign-In Button (UI Placeholder - Matches Reference Image) -->
      <button type="button" class="btn-google" id="btn-google-auth">
        <svg class="google-icon" width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4"
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
          <path fill="#34A853"
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
          <path fill="#FBBC05"
            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
          <path fill="#EA4335"
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
        </svg>
        <span>Continue with Google</span>
      </button>

      <!-- Footer Link -->
      <footer class="auth-footer">
        <span>Don't have an account?</span>
        <a href="/signup" class="auth-footer-link">Create Account</a>
      </footer>
    </main>

    <a href="/" class="auth-back-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="15 18 9 12 15 6" />
      </svg>
      <span>Back to TakeRemo</span>
    </a>
  </div>

  <script src="/auth-client.js"></script>
</body>

</html>
